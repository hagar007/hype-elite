<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hype Elite — camisas de time, tênis, meias, roupas de academia e acessórios selecionados.">
    <meta name="theme-color" content="#0a0a0a">
    <title>Hype Elite — Futebol, estilo e atitude</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="stylesheet" href="assets/css/styles.css?v=20260928-nike">
    <link rel="stylesheet" href="assets/css/mobile.css?v=20260928-mobile">
    <script src="assets/js/catalog-products.js?v=20260926" defer></script><script src="assets/js/store-data.js?v=20260928-mobile" defer></script>
    <script src="assets/js/app.js?v=20260928-mobile" defer></script>
    <script src="assets/js/home.js?v=20260928-mobile" defer></script>
  </head>
  <body data-page="home" data-root="">
    <div data-site-header></div>

    <main id="conteudo" class="home-clean">
      <section class="campaign shell" aria-labelledby="hero-title">
        <div class="campaign__copy">
          <p class="campaign__eyebrow">Hype Elite / Futebol</p>
          <h1 id="hero-title">Seu próximo<br>manto.</h1>
          <p>Vista a sua paixão.</p>
          <a class="button" href="categorias/camisas-de-time/">Explorar camisas <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M14 6l6 6-6 6"/></svg></a>
        </div>
        <div class="campaign__photos" aria-label="Fotos de camisas do catálogo">
          <img class="campaign__photo campaign__photo--back" src="assets/img/campaign/retro-640.webp" alt="Camisa retrô do PSG" width="640" height="800" fetchpriority="high" decoding="async">
          <img class="campaign__photo campaign__photo--front" src="assets/img/campaign/madrid-640.webp" alt="Camisa preta do Real Madrid" width="640" height="800" fetchpriority="high" decoding="async">
        </div>
      </section>

      <nav class="quick-shop shell" aria-label="Comprar por público e estilo">
        <a href="categorias/camisas-de-time/?publico=masculino">Masculino</a>
        <a href="categorias/camisas-de-time/?publico=feminino">Feminino</a>
        <a href="categorias/camisas-de-time/?publico=infantil">Infantil</a>
        <a href="categorias/camisas-de-time/?colecao=selecoes">Seleções</a>
        <a href="categorias/camisas-de-time/?colecao=retro">Retrô</a>
      </nav>

      <section class="home-products shell" aria-labelledby="selection-title">
        <div class="clean-heading"><h2 id="selection-title">Em destaque</h2><a href="categorias/camisas-de-time/">Ver tudo <span aria-hidden="true">↗</span></a></div>
        <div class="product-grid" data-featured-products></div>
      </section>

      <section class="home-collections shell" aria-labelledby="collections-title">
        <div class="clean-heading"><h2 id="collections-title">Escolha sua coleção</h2></div>
        <div class="collection-grid">
          <a class="collection-banner" href="categorias/camisas-de-time/?colecao=nacionais">
            <img src="assets/img/campaign/nacionais-640.webp" alt="Camisa de clube brasileiro" width="640" height="800" loading="lazy" decoding="async">
            <span class="collection-banner__copy"><strong>Nacionais</strong><span aria-hidden="true">↗</span></span>
          </a>
          <a class="collection-banner" href="categorias/camisas-de-time/?colecao=internacionais">
            <img src="assets/img/campaign/madrid-640.webp" alt="Camisa de clube internacional" width="640" height="800" loading="lazy" decoding="async">
            <span class="collection-banner__copy"><strong>Internacionais</strong><span aria-hidden="true">↗</span></span>
          </a>
          <a class="collection-banner" href="categorias/camisas-de-time/?colecao=selecoes">
            <img src="assets/img/campaign/selecoes-640.webp" alt="Camisa de seleção" width="640" height="800" loading="lazy" decoding="async">
            <span class="collection-banner__copy"><strong>Seleções</strong><span aria-hidden="true">↗</span></span>
          </a>
          <a class="collection-banner" href="categorias/camisas-de-time/?colecao=retro">
            <img src="assets/img/campaign/retro-640.webp" alt="Camisa retrô do PSG" width="640" height="800" loading="lazy" decoding="async">
            <span class="collection-banner__copy"><strong>Retrô</strong><span aria-hidden="true">↗</span></span>
          </a>
        </div>
      </section>

      <div class="more-categories shell">
        <details><summary>Mais categorias <span aria-hidden="true">+</span></summary><nav data-more-categories aria-label="Outras categorias"></nav></details>
      </div>
    </main>
    <div data-site-footer></div>
  </body>
</html>
